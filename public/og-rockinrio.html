<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>OG — Rock in Rio Lisboa 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      background: #080810;
    }
    .bg-img {
      position: absolute; inset: 0;
      object-fit: cover; width: 100%; height: 100%;
      filter: brightness(0.35);
    }
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, hsla(217,85%,20%,0.6) 0%, transparent 50%, hsla(0,70%,25%,0.5) 100%);
    }
    .gradient-bottom {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(8,8,16,0.95) 0%, rgba(8,8,16,0.4) 50%, transparent 100%);
    }
    .content {
      position: absolute;
      bottom: 48px; left: 56px; right: 56px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
    }
    .left { flex: 1; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      background: rgba(251,191,36,0.12);
      border: 1px solid rgba(251,191,36,0.25);
      margin-bottom: 16px;
    }
    .badge span {
      color: #fbbf24;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    .badge .star { color: #fbbf24; font-size: 12px; }
    h1 {
      font-size: 52px;
      font-weight: 900;
      color: white;
      line-height: 0.95;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }
    h1 span {
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      font-weight: 400;
    }
    .sub strong { color: rgba(255,255,255,0.7); font-weight: 600; }
    .logo-right {
      width: 160px; height: auto;
      filter: drop-shadow(0 0 30px rgba(30,100,220,0.3));
    }
    .top-bar {
      position: absolute;
      top: 40px; left: 56px; right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .oqd-logo {
      height: 32px;
      border-radius: 8px;
      opacity: 0.8;
    }
    .dates {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <img src="https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?w=1200&q=80" class="bg-img" alt="">
  <div class="overlay"></div>
  <div class="gradient-bottom"></div>

  <div class="top-bar">
    <img src="og-image.jpg" alt="Olha que Duas" class="oqd-logo">
    <span class="dates">20 · 21 · 27 · 28 Junho 2026 &mdash; Parque Tejo, Lisboa</span>
  </div>

  <div class="content">
    <div class="left">
      <div class="badge">
        <span class="star">★</span>
        <span>Parceiro Oficial</span>
      </div>
      <h1>Rock in Rio<br><span>Lisboa 2026</span></h1>
      <p class="sub">Katy Perry · Linkin Park · Rod Stewart · 21 Savage · <strong>+40 artistas</strong></p>
    </div>
    <img src="partners/rockinrio.png" class="logo-right" alt="Rock in Rio Lisboa">
  </div>
</body>
</html>
