<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Banner - Olha que Duas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .banner {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #d63031 0%, #b4292b 40%, #6d1517 100%);
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* Animated sound waves background */
    .sound-waves {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0.15;
    }

    .wave {
      position: absolute;
      border: 3px solid #FFD700;
      border-radius: 50%;
      animation: pulse 3s ease-out infinite;
    }

    .wave-1 {
      width: 600px;
      height: 600px;
      top: 50%;
      left: 25%;
      transform: translate(-50%, -50%);
      animation-delay: 0s;
    }

    .wave-2 {
      width: 800px;
      height: 800px;
      top: 50%;
      left: 25%;
      transform: translate(-50%, -50%);
      animation-delay: 0.5s;
    }

    .wave-3 {
      width: 1000px;
      height: 1000px;
      top: 50%;
      left: 25%;
      transform: translate(-50%, -50%);
      animation-delay: 1s;
    }

    .wave-4 {
      width: 1200px;
      height: 1200px;
      top: 50%;
      left: 25%;
      transform: translate(-50%, -50%);
      animation-delay: 1.5s;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.2);
      }
    }

    /* Glowing orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,215,0,0.4) 0%, transparent 70%);
      top: -100px;
      right: -50px;
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,100,100,0.3) 0%, transparent 70%);
      bottom: -50px;
      left: 30%;
    }

    .orb-3 {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 70%);
      top: 20%;
      right: 20%;
    }

    /* Floating particles */
    .particles {
      position: absolute;
      inset: 0;
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #FFD700;
      border-radius: 50%;
      opacity: 0.6;
    }

    .particle:nth-child(1) { top: 15%; left: 10%; width: 6px; height: 6px; }
    .particle:nth-child(2) { top: 25%; left: 85%; width: 10px; height: 10px; }
    .particle:nth-child(3) { top: 70%; left: 75%; width: 5px; height: 5px; }
    .particle:nth-child(4) { top: 80%; left: 15%; width: 8px; height: 8px; }
    .particle:nth-child(5) { top: 40%; left: 95%; width: 6px; height: 6px; }
    .particle:nth-child(6) { top: 60%; left: 5%; width: 4px; height: 4px; }

    /* Equalizer bars */
    .equalizer {
      position: absolute;
      display: flex;
      gap: 6px;
      align-items: flex-end;
      height: 80px;
    }

    .equalizer-left {
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
    }

    .equalizer-right {
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
    }

    .eq-bar {
      width: 8px;
      background: linear-gradient(180deg, #FFD700 0%, #FFA500 100%);
      border-radius: 4px;
      opacity: 0.7;
    }

    .equalizer-left .eq-bar:nth-child(1) { height: 30px; }
    .equalizer-left .eq-bar:nth-child(2) { height: 55px; }
    .equalizer-left .eq-bar:nth-child(3) { height: 40px; }
    .equalizer-left .eq-bar:nth-child(4) { height: 70px; }
    .equalizer-left .eq-bar:nth-child(5) { height: 45px; }

    .equalizer-right .eq-bar:nth-child(1) { height: 45px; }
    .equalizer-right .eq-bar:nth-child(2) { height: 70px; }
    .equalizer-right .eq-bar:nth-child(3) { height: 35px; }
    .equalizer-right .eq-bar:nth-child(4) { height: 60px; }
    .equalizer-right .eq-bar:nth-child(5) { height: 25px; }

    /* Main content */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      width: 100%;
      height: 100%;
      padding: 40px 60px;
    }

    /* Left side - Logo */
    .left-side {
      flex: 0 0 45%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrapper {
      position: relative;
    }

    /* Glow effect behind logo */
    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(255,215,0,0.4) 0%, rgba(255,215,0,0.1) 40%, transparent 70%);
      border-radius: 50%;
      filter: blur(20px);
    }

    .logo-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 360px;
      height: 360px;
      border: 3px solid rgba(255,215,0,0.3);
      border-radius: 50%;
    }

    .logo-ring-2 {
      width: 400px;
      height: 400px;
      border: 2px solid rgba(255,215,0,0.15);
    }

    .logo {
      position: relative;
      width: 320px;
      height: 320px;
      object-fit: contain;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
      z-index: 5;
    }

    /* Right side - Text */
    .right-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 20px;
    }

    /* Media icons */
    .media-icons {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .media-icon {
      width: 50px;
      height: 50px;
      background: rgba(255,215,0,0.2);
      border: 2px solid rgba(255,215,0,0.5);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .media-icon svg {
      width: 26px;
      height: 26px;
      fill: #FFD700;
    }

    /* Tagline */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 52px;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
      margin-bottom: 15px;
      line-height: 1.1;
    }

    .tagline .highlight {
      color: #FFD700;
      text-shadow: 0 0 30px rgba(255,215,0,0.5), 0 4px 20px rgba(0,0,0,0.4);
    }

    /* Subtitle */
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      line-height: 1.5;
      max-width: 500px;
    }

    /* Live badge */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 30px;
      margin-top: 25px;
      backdrop-filter: blur(10px);
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: #00ff00;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff00;
    }

    .live-text {
      color: white;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 55px;
      background: linear-gradient(90deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.5) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,215,0,0.2);
    }

    .bottom-item {
      color: rgba(255,255,255,0.95);
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bottom-item svg {
      width: 20px;
      height: 20px;
      fill: #FFD700;
    }

    .divider {
      width: 5px;
      height: 5px;
      background: #FFD700;
      border-radius: 50%;
    }

    /* Top accent */
    .top-accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, transparent 0%, #FFD700 30%, #FFD700 70%, transparent 100%);
    }
  </style>
</head>
<body>
  <div class="banner">
    <!-- Sound waves animation -->
    <div class="sound-waves">
      <div class="wave wave-1"></div>
      <div class="wave wave-2"></div>
      <div class="wave wave-3"></div>
      <div class="wave wave-4"></div>
    </div>

    <!-- Glowing orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Floating particles -->
    <div class="particles">

          </div>
        </div>

        <h1 class="tagline">
          Comunicação, Voz e<br>
          <span class="highlight">Negócios com Propósito</span>
        </h1>

        <p class="subtitle">
          Podcast, Rádio 24 horas e Vídeos sobre<br>

        </p>

        <div class="live-badge">
          <div class="live-dot"></div>
          <span class="live-text">Rádio ao Vivo 24h</span>

      </div>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
      <span class="bottom-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        Portugal
      </span>
      <div class="divider"></div>
      <span class="bottom-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93V7h2v1c0 2.76 2.24 5 5 5s5-2.24 5-5V7h2v4c0 4.08-3.06 7.44-7 7.93z"/></svg>
        www.olhaqueduas.com
      </span>
      <div class="divider"></div>
      <span class="bottom-item">
        <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.39 5.61 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
        @olhaqueduas2025
      </span>
    </div>
  </div>
</body>
</html>
