<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Banner - Olha que Duas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .banner {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #c93235 0%, #b4292b 30%, #8a1f21 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Decorative elements */
    .decoration-1 {
      position: absolute;
      top: -80px;
      right: -80px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .decoration-2 {
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, transparent 70%);
      border-radius: 50%;
    }

    .decoration-3 {
      position: absolute;
      top: 50%;
      left: 5%;
      transform: translateY(-50%);
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .decoration-4 {
      position: absolute;
      top: 50%;
      right: 5%;
      transform: translateY(-50%);
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* Subtle pattern overlay */
    .pattern {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* Content */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    /* Logo container */
    .logo-container {
      margin-bottom: 30px;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
    }

    .logo {
      width: 220px;
      height: 220px;
      object-fit: contain;
    }

    /* Tagline */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 700;
      color: #FFD700;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    /* Subtitle */
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 1px 5px rgba(0,0,0,0.2);
      max-width: 700px;
      line-height: 1.4;
    }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: linear-gradient(90deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.3) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    .bottom-item {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bottom-item svg {
      width: 18px;
      height: 18px;
      fill: #FFD700;
    }

    .divider {
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
    }

    /* Golden accent line */
    .accent-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, transparent 0%, #FFD700 20%, #FFD700 80%, transparent 100%);
    }
  </style>
</head>
<body>
  <div class="banner">
    <!-- Decorative elements -->
    <div class="decoration-1"></div>
    <div class="decoration-2"></div>
    <div class="decoration-3"></div>
    <div class="decoration-4"></div>
    <div class="pattern"></div>

    <!-- Golden accent line at top -->
    <div class="accent-line"></div>

    <!-- Main content -->
    <div class="content">
      <div class="logo-container">
        <img src="https://www.olhaqueduas.com/og-image.png" alt="Olha que Duas" class="logo">
      </div>

      <h1 class="tagline">Comunicacao, Voz e Negocios com Proposito</h1>

      <p class="subtitle">Podcast, Radio 24h e Assessoria de Comunicacao em Portugal</p>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
      <span class="bottom-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        Portugal
      </span>
      <div class="divider"></div>
      <span class="bottom-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        www.olhaqueduas.com
      </span>
      <div class="divider"></div>
      <span class="bottom-item">
        <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.39 5.61 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
        @olhaqueduas2025
      </span>
    </div>
  </div>
</body>
</html>
