<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Banner — Olha que Duas Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Fredoka', 'Inter', sans-serif;
    }

    .banner {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      /* Vibrant kids-show sky gradient */
      background:
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(255,224,138,0.95), transparent 70%),
        linear-gradient(180deg, #ff8ec0 0%, #ffa1e0 12%, #b58ef2 28%, #7eb6ff 48%, #79d8ff 68%, #ffe88a 95%);
    }

    /* Rainbow arch behind everything */
    .rainbow {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 1100px;
      height: 800px;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 64%, #ff5e8a 64%, #ff5e8a 67%, transparent 67%),
        radial-gradient(circle, transparent 67%, #ffa64d 67%, #ffa64d 70%, transparent 70%),
        radial-gradient(circle, transparent 70%, #ffd93b 70%, #ffd93b 73%, transparent 73%),
        radial-gradient(circle, transparent 73%, #5dd96b 73%, #5dd96b 76%, transparent 76%),
        radial-gradient(circle, transparent 76%, #4cb6ff 76%, #4cb6ff 79%, transparent 79%),
        radial-gradient(circle, transparent 79%, #a978ff 79%, #a978ff 82%, transparent 82%);
      opacity: 0.55;
      z-index: 1;
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 40px;
      right: 60px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff8b8, #ffd93b 50%, #ff8a3d 100%);
      box-shadow:
        0 0 100px rgba(255, 213, 79, 0.95),
        0 0 50px rgba(255, 138, 61, 0.7),
        inset -10px -10px 30px rgba(255,138,61,0.3);
      z-index: 2;
    }
    .sun::before, .sun::after {
      content: '';
      position: absolute;
      inset: 18%;
      border-radius: 50%;
    }
    /* sun cheek detail */
    .sun-eyes {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -25%);
      width: 60px;
      height: 6px;
      display: flex;
      justify-content: space-between;
      z-index: 3;
    }
    .sun-eyes::before, .sun-eyes::after {
      content: '';
      width: 10px;
      height: 10px;
      background: #5b3a1e;
      border-radius: 50%;
    }

    /* Clouds */
    .cloud {
      position: absolute;
      background: #ffffff;
      border-radius: 100px;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.12));
      z-index: 2;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
    }
    .cloud-1 { top: 50px;  left: 60px;  width: 200px; height: 60px; }
    .cloud-1::before { width: 80px; height: 80px; top: -40px; left: 30px; }
    .cloud-1::after  { width: 60px; height: 60px; top: -25px; left: 100px; }

    .cloud-2 { top: 170px; left: 360px; width: 140px; height: 45px; }
    .cloud-2::before { width: 60px; height: 60px; top: -28px; left: 22px; }
    .cloud-2::after  { width: 48px; height: 48px; top: -16px; left: 70px; }

    .cloud-3 { top: 90px; right: 230px; width: 160px; height: 50px; }
    .cloud-3::before { width: 64px; height: 64px; top: -32px; left: 26px; }
    .cloud-3::after  { width: 50px; height: 50px; top: -18px; left: 86px; }

    .cloud-4 { top: 220px; right: 30px; width: 130px; height: 42px; }
    .cloud-4::before { width: 52px; height: 52px; top: -26px; left: 20px; }
    .cloud-4::after  { width: 42px; height: 42px; top: -14px; left: 65px; }

    /* Floating party balloons */
    .balloon {
      position: absolute;
      width: 56px;
      height: 70px;
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      box-shadow: inset -8px -10px 18px rgba(0,0,0,0.18), inset 6px 6px 12px rgba(255,255,255,0.55);
      z-index: 2;
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: #6b6b6b;
    }
    .balloon-1 { top: 60px;  left: 280px; background: #ff5e8a; }
    .balloon-2 { top: 130px; left: 230px; background: #ffd93b; transform: rotate(-6deg); width: 50px; height: 64px; }
    .balloon-3 { top: 200px; right: 320px; background: #4cb6ff; transform: rotate(5deg); }
    .balloon-4 { top: 90px;  right: 190px; background: #a978ff; width: 50px; height: 64px; }
    .balloon-5 { top: 250px; right: 380px; background: #5dd96b; transform: rotate(-4deg); width: 46px; height: 58px; }

    /* Stars / sparkles */
    .star {
      position: absolute;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,0.12));
      z-index: 2;
    }
    .s1  { top: 110px; left: 540px; color: #fde047; font-size: 32px; }
    .s2  { top: 230px; left: 290px; color: #ff5e8a; font-size: 22px; }
    .s3  { top: 130px; right: 380px; color: #60a5fa; font-size: 26px; }
    .s4  { top: 280px; right: 60px; color: #fb923c; font-size: 24px; }
    .s5  { top: 60px;  left: 470px; color: #a978ff; font-size: 20px; }
    .s6  { top: 170px; right: 470px; color: #5dd96b; font-size: 22px; }
    .s7  { top: 320px; left: 510px; color: #ffd93b; font-size: 18px; }
    .s8  { top: 40px;  right: 410px; color: #ff5e8a; font-size: 18px; }

    /* Confetti dots */
    .confetti {
      position: absolute;
      border-radius: 2px;
      z-index: 2;
    }
    .c1 { top: 80px;  left: 360px; width: 12px; height: 6px;  background: #ff5e8a; transform: rotate(20deg); }
    .c2 { top: 220px; left: 410px; width: 10px; height: 5px;  background: #ffd93b; transform: rotate(-15deg); }
    .c3 { top: 160px; right: 540px; width: 12px; height: 6px; background: #5dd96b; transform: rotate(35deg); }
    .c4 { top: 270px; right: 460px; width: 10px; height: 5px; background: #4cb6ff; transform: rotate(-25deg); }
    .c5 { top: 60px;  right: 510px; width: 12px; height: 6px; background: #a978ff; transform: rotate(15deg); }
    .c6 { top: 290px; left: 320px; width: 10px; height: 5px;  background: #fb923c; transform: rotate(45deg); }
    .c7 { top: 380px; left: 480px; width: 12px; height: 6px;  background: #ff5e8a; transform: rotate(-10deg); }
    .c8 { top: 360px; right: 510px; width: 10px; height: 5px; background: #ffd93b; transform: rotate(20deg); }

    /* Em Breve badge */
    .badge {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 26px;
      background: #ffffff;
      border: 4px solid #ffd93b;
      border-radius: 999px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.22);
      z-index: 12;
    }
    .badge .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ec4899;
      box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.25);
    }
    .badge span {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #db2777;
    }

    /* Logo at the top-right corner (replaces the sun) */
    .logo-wrap {
      position: absolute;
      top: 30px;
      right: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 8;
    }
    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -40px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 60%);
      filter: blur(28px);
      z-index: 0;
    }
    .logo-wrap img {
      position: relative;
      width: 260px;
      height: 260px;
      object-fit: contain;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,0.38));
      z-index: 1;
    }

    /* Stage with characters (zoomed in, full height available) */
    .stage {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 50px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0;
      padding: 0 20px;
      z-index: 7;
    }

    .char {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      flex-shrink: 0;
    }
    .char::before {
      content: '';
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 24px;
      background: rgba(0,0,0,0.30);
      border-radius: 50%;
      filter: blur(12px);
      z-index: 0;
    }
    .char img {
      position: relative;
      width: auto;
      object-fit: contain;
      z-index: 1;
      filter: drop-shadow(0 18px 24px rgba(0,0,0,0.30));
    }
    /* Both cartoons drawn at matching scale and proportions in source —
       no horizontal squish needed. */
    .char img { height: 500px; }
    .char.alexandra { margin-right: -10px; }
    .char.marluce   { margin-left: -10px; }

    /* Hills */
    .hill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 130px;
      z-index: 5;
    }
    .hill svg { width: 100%; height: 100%; display: block; }

    /* Bottom URL strip */
    .url {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 24px;
      background: #ffffff;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 16px;
      color: #db2777;
      box-shadow: 0 8px 22px rgba(0,0,0,0.22);
      z-index: 13;
      border: 3px solid #ffd93b;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="rainbow"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>

    <div class="balloon balloon-1"></div>
    <div class="balloon balloon-2"></div>
    <div class="balloon balloon-3"></div>
    <div class="balloon balloon-4"></div>
    <div class="balloon balloon-5"></div>

    <div class="star s1">★</div>
    <div class="star s2">✦</div>
    <div class="star s3">★</div>
    <div class="star s4">✦</div>
    <div class="star s5">★</div>
    <div class="star s6">✦</div>
    <div class="star s7">★</div>
    <div class="star s8">✦</div>

    <div class="confetti c1"></div>
    <div class="confetti c2"></div>
    <div class="confetti c3"></div>
    <div class="confetti c4"></div>
    <div class="confetti c5"></div>
    <div class="confetti c6"></div>
    <div class="confetti c7"></div>
    <div class="confetti c8"></div>

    <div class="logo-wrap">
      <img src="./og-kids.png" alt="Olha que Duas Kids">
    </div>

    <div class="stage">
      <div class="char alexandra">
        <img src="./alexandra-cartoon-clean.png" alt="Alexandra">
      </div>

      <div class="char marluce">
        <img src="./marluce-cartoon-clean.png" alt="Marluce">
      </div>
    </div>

    <div class="hill">
      <svg viewBox="0 0 1200 130" preserveAspectRatio="none">
        <path fill="#7CC576" opacity="0.85" d="M0 70 C200 20, 400 110, 600 60 S1000 20, 1200 70 L1200 130 L0 130 Z"/>
        <path fill="#5BAE52" d="M0 95 C200 60, 430 130, 640 95 S1020 60, 1200 95 L1200 130 L0 130 Z"/>
      </svg>
    </div>

  </div>
</body>
</html>
